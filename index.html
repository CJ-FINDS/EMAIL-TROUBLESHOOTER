<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email Issue Workflow</title>
<style>
:root{--bg:#0e0e0e;--card:#1a1a1a;--row:#242424;--text:#d6d6d6;--muted:#8f8f8f;--edge:rgba(255,255,255,.28);--white:#d0d0d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:820px;margin:auto}
h1{margin:0;font-size:13px;letter-spacing:.25em;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
main{max-width:820px;margin:auto;padding:8px 20px 60px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:22px}
.tag{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px}
.q{font-size:clamp(18px,3.4vw,24px);line-height:1.4;margin:0 0 20px}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;border-radius:12px;padding:12px 20px;cursor:pointer;border:1px solid var(--edge);color:var(--text);background:transparent;transition:background .2s,color .2s,transform .2s,box-shadow .2s}
button:hover{background:var(--white);color:#000;transform:translateY(-2px);box-shadow:0 5px 14px rgba(255,255,255,.1)}
button:active{transform:none}
button.main{background:var(--white);color:#000;border-color:var(--white)}
button.main:hover{background:#000;color:var(--text)}
button.sm{padding:8px 14px;font-size:12px}
button.opt{width:100%;text-align:left;margin-bottom:10px;padding:16px}
.log{margin-top:18px;font-size:13px;color:var(--muted)}
.log div{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
textarea{width:100%;min-height:240px;margin-top:14px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--text);background:#000;border:1px solid var(--edge);border-radius:12px;padding:12px;resize:vertical}
.msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.pop{background:var(--card);border:1px solid var(--white);border-radius:18px;padding:26px;max-width:420px;text-align:center}
.pop p{font-size:18px;line-height:1.4;margin:0 0 18px}
</style></head><body>
<header><h1>EMAIL ISSUE WORKFLOW</h1>
<div class="tools"><button class="sm" id="back">&larr; BACK</button><button class="sm" id="restart">RESTART SESSION</button></div></header>
<main id="app"></main>
<div class="ov" id="ov"><div class="pop"><p>All resources checked. Please ask approval to escalate the issue</p><button class="main" id="ok">OK</button></div></div>
<script>
const N={};
const chain=(p,a,end)=>{a.forEach((q,i)=>{N[p+i]={t:'s',q,n:i<a.length-1?p+(i+1):end}});return p+'0'};
const ch=(id,q,o)=>{N[id]={t:'c',q,o};return id};
N.END={t:'e'};
const junk="First have the customer check junk/spam",bl="Check if the sender is blocklisted",test="Try sending a test email",
bb="Check for bouncebacks (some bouncebacks are understandable)",
eml="If no bounceback: download the sent email from the sentbox as an EML file and include it in your escalation",
pop="Check mail client connections (POP3 is one to look out for, but IMAP should be noted as well)",
dns="Check DNS Records and make sure they are correct",
dom="Verify that the domain name is active (with no holds on whois.com)",
act="Verify that the email address is active",
fr="Check Filter Rules";
const qs="Is the customer not getting emails from a specific sender, or not getting emails from anyone at all?";
/* OXC */
const oxcS=chain('oxcs',[junk,fr,bl,test,bb,eml],'END');
const oxcA=chain('oxca',["Check Filter Rules and Storage in CMC",pop,test,bb,eml],'END');
ch('oxcQ',qs,[['Specific sender',oxcS],['Not receiving all emails',oxcA]]);
const oxc=chain('oxc',["Verify permissions are turned on in CMC and Storage",dns],'oxcQ');
/* OX */
const oxS=chain('oxs',[junk,"Check Filter Rules and Storage",bl,test,bb,eml],'END');
const oxA=chain('oxa',["Check Filter Rules and Storage in PCP","Check Mailhub for possible suspension",pop,test,bb,eml],'END');
ch('oxQ',qs,[['Specific sender',oxS],['Not receiving all emails',oxA]]);
const ox=chain('ox',[dns],'oxQ');
/* VDECK */
const vdS=chain('vds',[junk,"Check Filter Rules and Storage",bl,bb,eml],'END');
const vdA=chain('vda',["Check Filter Rules and Storage in MailCentral",pop,test,bb,eml],'END');
ch('vdQ',qs,[['Specific sender',vdS],['Not receiving all emails',vdA]]);
const vd=chain('vd',["Check CSFE and make sure Service is active (if Suspended, escalate to Resubscribe customer)",dns],'vdQ');
ch('plat','Identify the email platform',[['OXC',oxc],['OX',ox],['VDECK',vd]]);
/* shared */
const cl=chain('cl',["Check mail server settings","Try resetting up email by removing and adding it again","If all configurations are correct, offer MTS"],'END');
const rw=chain('rw',[dom,act],'plat');
const sw=chain('sw',[dom,act,"Check TXT Record and make sure it is correct","Check suspensions in Mailhub CMC or CSFE","Check Filter Rules and Storage",bb,"Check if emails are showing under the Sent Folder (if it shows there and the recipient did not receive the email, escalate)","Download the sent email from the sentbox as an EML file and include it in your escalation"],'END');
const cw='Verify whether the customer is using Webmail or an Email Client';
ch('rs',cw,[['Only Email Client is not working',cl],['Webmail is not working',rw]]);
ch('ss',cw,[['Only Email Client is not working',cl],['Webmail is not working',sw]]);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur=null,stack=[],log=[],mode='',issue=null,note=null,status='';
const pick=m=>{mode=m;stack=[null];log=[];issue=null;note=null;cur=m==='SENDING'?'ss':'rs';render()};
const adv=(id,e)=>{stack.push(cur);log.push(e);cur=id;note=null;status='';render();if(id==='END')$('ov').classList.add('on')};
function back(){if(issue){issue=null;note=null;return render()}if(cur===null)return;const p=stack.pop();if(p!==null)log.pop();cur=p;if(p===null)mode='';note=null;render()}
function restart(){cur=null;stack=[];log=[];mode='';issue=null;note=null;status='';$('ov').classList.remove('on');render()}
function buildNote(){
 const m=mode==='BOTH'?'Both (Receiving issues workflow followed)':mode==='RECEIVING'?'Receiving issue':'Sending issue';
 let t="EMAIL TROUBLESHOOTING NOTE\nIssue type: "+m+"\n\nSteps covered:\n";
 log.forEach((e,i)=>{t+=(i+1)+". "+e+"\n"});
 t+="\n"+(issue?"ISSUE FOUND at: "+issue:"Result: All resources checked, no issue found. Approval to escalate required.");
 return t}
function copyNote(){
 note=buildNote();status='';render();
 const ta=$('noteBox');ta.focus();ta.select();
 let done=false;
 try{done=document.execCommand('copy')}catch(e){}
 const fin=ok=>{status=ok?'Note copied to clipboard.':'Select the text above and copy it (Ctrl+C).';const s=$('st');if(s)s.textContent=status};
 if(done)fin(true);else if(navigator.clipboard)navigator.clipboard.writeText(note).then(()=>fin(true),()=>fin(false));else fin(false)}
function noteBlock(){return `<div class="row" style="margin-top:6px"><button class="main" data-a="copy">COPY NOTE</button></div>`+(note?`<textarea id="noteBox" readonly>${esc(note)}</textarea><div class="msg" id="st">${status}</div>`:'')}
function render(){
 let h='';
 if(cur===null){
  h=`<div class="card"><div class="tag">START</div><p class="q">What type of issue is the customer reporting?</p>
  <button class="opt" data-a="m" data-m="RECEIVING">RECEIVING ISSUE</button>
  <button class="opt" data-a="m" data-m="SENDING">SENDING ISSUE</button>
  <button class="opt" data-a="m" data-m="BOTH">BOTH</button></div>`;
 }else if(issue){
  h=`<div class="card"><div class="tag">ISSUE FOUND</div><p class="q">${esc(issue)}</p>${noteBlock()}</div>`;
 }else{
  const n=N[cur];
  if(n.t==='e')h=`<div class="card"><div class="tag">ALL STEPS CHECKED</div><p class="q">All resources checked. Please ask approval to escalate the issue.</p>${noteBlock()}</div>`;
  else if(n.t==='c')h=`<div class="card"><div class="tag">QUESTION</div><p class="q">${esc(n.q)}</p>${n.o.map((o,i)=>`<button class="opt" data-a="o" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
  else h=`<div class="card"><div class="tag">STEP ${log.filter(x=>x.startsWith('\u2714')).length+1}</div><p class="q">${esc(n.q)}</p><div class="row"><button class="main" data-a="next">NEXT</button><button data-a="issue">ISSUE FOUND</button></div></div>`;
 }
 if(log.length&&!note)h+=`<div class="log"><b>COVERED SO FAR</b>${log.map(e=>`<div>${esc(e)}</div>`).join('')}</div>`;
 $('app').innerHTML=h;
}
$('app').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,n=N[cur];
 if(a==='m')pick(b.dataset.m);
 else if(a==='next')adv(n.n,'\u2714 '+n.q);
 else if(a==='o'){const o=n.o[+b.dataset.i];adv(o[1],n.q+' \u2192 '+o[0])}
 else if(a==='issue'){issue=n.q;note=null;render()}
 else if(a==='copy')copyNote();
});
$('back').onclick=back;$('restart').onclick=restart;$('ok').onclick=()=>$('ov').classList.remove('on');
render();
</script></body></html>
